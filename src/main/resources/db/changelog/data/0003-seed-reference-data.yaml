        - sql:
            sql: INSERT INTO marketdata (instrument_id, high, low, open, close, previous_close, datetime) SELECT id, 20.50, 20.50, 20.50, 20.50, 20.50, TIMESTAMP '2023-07-13 00:00:00' FROM instruments WHERE ticker = 'DOME'
