  # ---------------------------------------------------------------------
  # marketdata - cotizaciones de referencia. Se resuelven por ticker
  # para no depender del id generado. previous_close difiere de close
  # para poder verificar el rendimiento diario.
  # ---------------------------------------------------------------------
  - changeSet:
      id: 0003-003-seed-marketdata
      author: portfolio
      preConditions:
        onFail: MARK_RAN
        onFailMessage: cotizaciones ya cargadas
        # Se aplica solo si la tabla aun no tiene filas (count = 0).
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM marketdata
