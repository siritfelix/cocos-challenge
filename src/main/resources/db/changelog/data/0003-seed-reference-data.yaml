databaseChangeLog:

  # ---------------------------------------------------------------------
  # users - cuentas de referencia. El numero de cuenta (account_number)
  # es el identificador que viaja en la cabecera X-AccountNumber.
  # ---------------------------------------------------------------------
  - changeSet:
      id: 0003-001-seed-users
      author: portfolio
      preConditions:
        onFail: MARK_RAN
        onFailMessage: usuarios ya cargados
        # Se aplica solo si la tabla aun no tiene filas (count = 0).
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM users
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: "emiliano@test.com"
              - column:
                  name: account_number
                  value: "10001"
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: "jose@test.com"
              - column:
                  name: account_number
                  value: "10002"
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: "francisco@test.com"
              - column:
                  name: account_number
                  value: "10003"
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: "juan@test.com"
              - column:
                  name: account_number
                  value: "10004"

